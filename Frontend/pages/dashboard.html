<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — MATCHPOINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div>
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
          <span class="topbar-title">Dashboard</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
      </header>

      <main class="content">
        <div class="page-header">
          <div class="page-header-text">
            <h1>Visão geral</h1>
            <p>Acompanhe o que está acontecendo no centro esportivo agora.</p>
          </div>
        </div>

        <section class="grid grid-4" id="kpi-grid" aria-label="Indicadores gerais">
          <div class="card state-block"><div class="spinner"></div></div>
        </section>

        <div class="grid grid-2" style="margin-top: var(--sp-6); align-items: start;">
          <section class="card" aria-labelledby="next-matches-title">
            <h2 id="next-matches-title" class="card-title">Próximas partidas</h2>
            <p class="card-subtitle">As partidas mais próximas, de qualquer torneio.</p>
            <div id="next-matches-list" style="margin-top: var(--sp-4);">
              <div class="state-block"><div class="spinner"></div></div>
            </div>
          </section>

          <section class="card" aria-labelledby="courts-status-title">
            <h2 id="courts-status-title" class="card-title">Status das quadras</h2>
            <p class="card-subtitle">Disponibilidade neste momento.</p>
            <div id="courts-status-list" style="margin-top: var(--sp-4);">
              <div class="state-block"><div class="spinner"></div></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
