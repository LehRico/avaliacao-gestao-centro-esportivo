<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equipes — MATCHPOINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/tournaments.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div>
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
          <span class="topbar-title">Equipes</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
      </header>

      <main class="content">
        <div class="page-header">
          <div class="page-header-text">
            <h1>Equipes</h1>
            <p>Equipes cadastradas no centro esportivo.</p>
          </div>
          <div class="page-actions">
            <a href="equipe-nova.html" class="btn btn-primary">Nova equipe</a>
          </div>
        </div>

        <div class="cluster" style="margin-bottom: var(--sp-5);">
          <div class="field" style="margin-bottom: 0;">
            <label for="sport-filter">Esporte</label>
            <select id="sport-filter">
              <option value="">Todos</option>
            </select>
          </div>
        </div>

        <div id="teams-grid" class="grid grid-3">
          <div class="card state-block"><div class="spinner"></div></div>
        </div>

        <div class="cluster" id="pagination" style="justify-content: center; margin-top: var(--sp-6);"></div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/equipes.js"></script>
</body>
</html>
