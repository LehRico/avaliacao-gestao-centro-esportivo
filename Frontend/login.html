<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — MATCHPOINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/auth-page.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-body">
  <main class="auth-panel">
    <a href="index.html" class="btn btn-ghost btn-sm auth-back">← Voltar ao início</a>
    <div class="auth-brand">MATCH<span>POINT</span></div>
    <p class="auth-tagline">Gestão de Centro Esportivo</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          required
        />
        <span class="field-error" id="email-error"></span>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <span class="field-error" id="password-error"></span>
      </div>

      <div class="alert alert-danger" id="form-error" role="alert" hidden style="margin-bottom: var(--sp-4);"></div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        Entrar
      </button>
    </form>

    <p class="auth-hint">
      Ainda não tem conta? <a href="registro.html">Criar conta</a>
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
