<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MATCHPOINT — Gestão de Centro Esportivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/matches.css" />
<link rel="stylesheet" href="css/landing.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="landing-body">
  <header class="landing-header">
    <div class="landing-brand">MATCH<span>POINT</span></div>
    <nav class="landing-nav">
      <a href="login.html" class="btn btn-ghost btn-sm">Entrar</a>
      <a href="registro.html" class="btn btn-primary btn-sm">Criar conta</a>
    </nav>
  </header>

  <main>
    <section class="landing-hero">
      <h1>Gestão de Centro Esportivo</h1>
      <p>Acompanhe torneios, equipes e partidas em um só lugar.</p>
      <div class="cluster" style="justify-content: center; margin-top: var(--sp-5);">
        <a href="login.html" class="btn btn-primary">Acessar sistema</a>
      </div>
    </section>

    <section class="landing-section">
      <div class="landing-section-header">
        <h2>Esportes disponíveis</h2>
      </div>
      <div id="sports-list" class="sports-grid">
        <div class="state-block"><div class="spinner"></div></div>
      </div>
    </section>

    <section class="landing-section">
      <div class="landing-section-header">
        <h2>Torneios em andamento</h2>
      </div>
      <div id="tournaments-list" class="grid grid-3">
        <div class="card state-block"><div class="spinner"></div></div>
      </div>
    </section>

    <section class="landing-section">
      <div class="landing-section-header">
        <h2>Próximas partidas</h2>
      </div>
      <div id="matches-list" class="grid grid-3">
        <div class="card state-block"><div class="spinner"></div></div>
      </div>
    </section>
  </main>

  <footer class="landing-footer">
    <span>MATCHPOINT · Gestão de Centro Esportivo</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
